openapi: 3.0.4
info:
  title: WASAText
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
security: 
  - userAuth: []
tags:
  - name: user
    description: Operations about user
  - name: login
    description: Access operation
  - name: conversation
    description: Operations about conversation
  - name: message
    description: Operations about message
paths:
  /session:
    post:
      tags: [login]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserID"
      security: []
  /users/me:
    patch:
      tags: [user]
      summary: Updates username
      description: Changes the logged in username with a new one.
      operationId: setMyUserName
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        "200":
          description: Username update successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/me/conversations:
    get:
      tags: [user]
      summary: Gives all of the user conversations
      description: |-
        Get a preview of all the user conversations. This preview includes 
        every attribute that a normal conversation has with the exception that 
        not all messages are obtained, just the latest one.
      operationId: getMyConversations
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
              schema:
                type: object
                description: Object containing the chat preview
                required: [chats]
                properties:
                  chats:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationPreview"
  /users/me/photo:
    patch:
      tags: [user]
      summary: Updates user profile image
      operationId: setMyPhoto
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              description: Object containing the image in bin format
              properties:
                image:
                  type: string
                  format: binary
                  description: The image
      responses:
        "200":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: [conversation]
      summary: Gives conversation details
      operationId: getConversationDetails
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Conversation"
    patch:
      tags: [conversation]
      summary: Updates group name
      operationId: setGroupName
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the new group name
              properties:
                name:
                  type: string
                  example: Gruppo Università
                  description: The group name
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        "204":
          description: Group name updated successfully
  /conversations/{conversationId}/photo:
    patch:
      tags: [conversation]
      summary: Updates group profile image
      operationId: setGroupPhoto
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              description: Object containing the new image in bin format
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image
      responses:
        "200":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: [conversation]
      summary: Gives all messages of a conversation
      operationId: getConversation
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
                schema:
                  type: object
                  description: Object containing all the messages
                  required: [messageList]
                  properties:
                    messageList:
                      type: array
                      description: The message list
                      items:
                        $ref: "#/components/schemas/Message"
    post:
      tags: [conversation]
      summary: Sends a new message in a conversation
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "201":
          description: Message created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /conversations/{conversationId}/partecipants:
    post: 
      tags: [conversation]
      summary: Adds a user to a group
      operationId: AddToGroup
      parameters: 
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the user ID to add
              properties:
                userToAdd:
                  $ref: "#/components/parameters/userId"
      responses:
        "201":
          description: User added successfully
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Partecipant"
  /conversations/{conversationId}/partecipants/me:
    delete:
      tags: [conversation]
      summary: Removes logged-in user from a group
      operationId: leaveGroup
      parameters: 
        - $ref: "#/components/parameters/conversationId"
      responses:
        "204":
          description: User removed successfully
  /messages:
    post:
      tags: [message]
      summary: Forwards a message to another conversation
      operationId: forwardMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the message ID and the conversation ID
              properties:
                forwardedForm:
                  $ref: "#/components/parameters/messageId"
                destinationId:
                  $ref: "#/components/parameters/conversationId"
      responses:
        '201':
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /messages/{messageId}:
    delete:
      tags: [message]
      summary: Deletes a message
      operationId: deleteMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "204":
          description: Comment removed successfully
  /messages/{messageId}/comments:
    post:
      tags: [message]
      summary: Comments a message with an emoji
      operationId: commentMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the emoji to add
              properties:
                emoji:
                  type: string
                  example: 😋
                  description: The emoji
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /messages/{messageId}/comments/me:  
    delete:
      tags: [message]
      operationId: uncommentMessage
      summary: Deletes a comment
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        '204':
          description: Comment removed successfully
components:
  schemas:
    UserID: 
      type: integer
      format: int64
      minimum: 1
      maximum: 999999
      example: 32
    UserName:
      type: string
      minLength: 3
      maxLength: 16
      example: Mario    
    User:
      allOf:
        - $ref: "#/components/schemas/UserID"
        - $ref: "#/components/schemas/UserName"
        - title: Image
          type: string
          format: url
    Partecipant:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            isPartOf:
              $ref: "#/components/parameters/conversationId"
    Conversation:
      type: object
      required: [conversationId, type]
      properties:
        conversationId:
          $ref: "#/components/parameters/conversationId"
        name:
          type: string
          example: Gruppo Calcio
          description: The name
        image:
          type: string
          format: url
          description: The image
        type:
          type: string
          enum: [group, direct]
          description: The type, must be group or direct
    ConversationPreview:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            latestMessage:
              anyOf:
                - $ref: "#/components/parameters/messageId"
                - type: string
                  format: url
    Message:
      type: object
      required: [messageId, senderId, chatId, content, timeStamp, status]
      properties:
        messageId: 
          $ref: "#/components/parameters/messageId"
        senderId:
          $ref: "#/components/parameters/userId"
        chatId:
          $ref: "#/components/parameters/conversationId"
        content:
          anyOf:
            - type: string
              example: Hello! How are you?
            - type: string
              format: url
        timeStamp:
          type: string
          format: date-time
          example: 2025-11-03T17:30:00+01:00
        status:
          type: string
          description: Represents the message status.
          enum: [read, sent, received]
        isForwarded:
          type: boolean
    Comment:
      type: object
      properties:
        reacterId:
          $ref: "#/components/parameters/userId"
        emoji:
          type: string
          example: 😋
  parameters:
    userId:
      in: path
      name: userId
      schema:
        type: integer
        description: Object containing the user ID
        format: int64
        example: 32
        minimum: 1
        maximum: 9007199254740991
      required: true
    conversationId:
      in: path
      name: conversationId
      schema:
        type: integer
        description: Object containing the conversation ID
        format: int64
        example: 32
        minimum: 1
        maximum: 9007199254740991
      required: true
    messageId:
      in: path
      name: messageId
      schema:
        type: integer
        description: Object containing the message ID
        format: int64
        example: 32
        minimum: 1
        maximum: 9007199254740991
      required: true
  securitySchemes:
      userAuth:
        type: http
        scheme: bearer
        bearerFormat: int64