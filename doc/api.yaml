openapi: 3.0.4
info:
  title: WASAText
  version: 0.0.3
security: 
  - userAuth: []
tags:
  - name: user
    description: Operations about user
  - name: login
    description: Access operation
  - name: conversation
    description: Operations about conversation
  - name: message
    description: Operations about message
paths:
  /session:
    post:
      tags: [login]
      summary: Logs in the user.
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: 'ˆ.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    $ref: "#/components/parameters/userId"
  /users/{userId}:
    patch:
      tags: [user]
      summary: Update username.
      description: Change the logged in username with a new one.
      operationId: setMyUserName
      parameters: 
        - $ref: "#/components/parameters/userId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: 'ˆ.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}/conversations:
    get:
      tags: [user]
      summary: See all of the user conversations.
      description: |-
        Get a preview of all the user conversations. This preview includes 
        every attribute that a normal conversation has with the exception that 
        not all messages are obtained, just the latest one.
      operationId: getMyConversations
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationPreview"
  /conversation/{conversationId}:
    get:
      tags: [conversation]
      summary: See conversation details.
      operationId: getConversationDetails
      parameters:
        - $ref: "#/components/parameters/conversationId"
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Conversation"
  /conversation/{conversationId}/messages:
    get:
      tags: [conversation]
      summary: See all messages of a conversation.
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/conversationId"
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    messages:
                      type: array
                      items:
                        $ref: "#/components/schemas/Message"
    post:
      tags: [conversation]
      summary: Send a new message in a conversation.
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "201":
          description: Message created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /messages/{messageId}/forward:
    post:
      tags: [message]
      summary: Forward a message to another conversation.
      operationId: forwardMessage
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - $ref: "#/components/parameters/messageId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  $ref: "#/components/parameters/conversationId"
        required: true
      responses:
        '201':
          description: Message forwarded
  /messages/{messageId}/comments:
    patch:
      tags: [message]
      summary: Comment a message with an emoji.
      operationId: commentMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
                  example: 😋
        required: true
      responses:
        '201':
          description: Comment added
components:
  schemas:
    User:
      type: object
      required: [id]
      properties:
        id: 
          type: integer
          format: int64
          example: 7
        username:
          type: string
          example: Mario
          minLength: 3
          maxLength: 16
        image:
        # TODO: capire come definire l'immagine nell'API
          type: string
    Conversation:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          example: 11
        name:
          type: string
          example: Gruppo Calcio
        partecipants:
              type: array
              items:
                $ref: "#/components/schemas/User"
        image:
          type: string
        # TODO: capire come definire l'immagine nell'API
        type:
          type: string
          enum: [group, direct]
    ConversationPreview:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            latestMessage:
              $ref: "#/components/schemas/Message"
              # TODO: Se il messaggio è un'immagine voglio un'icona. Da implementare!
    Message:
      type: object
      required: [id, senderId, conversationId, content, timeStamp]
      properties:
        id: 
          type: integer
          format: int64
          example: 33
        senderId:
          $ref: "#/components/parameters/userId"
        conversationId:
          $ref: "#/components/parameters/conversationId"
        content:
          type: string
          example: Hello! How are you?
          # TODO: capire come gestire l'API per mandare una foto tramite messaggio
        timeStamp:
          type: string
          format: date-time
          example: 2025-11-03T17:30:00+01:00
        comment:
          type: array
          items:
            type: object
            properties:
              reacter:
                $ref: "#/components/parameters/userId"
              emoji:
                type: string
                example: 😋
        status:
          type: string
          description: Represents the message status, ✓ means *received*, ✓✓ means *read*
          enum: [✓, ✓✓]
        isForwarded:
          type: boolean
  parameters:
    userId:
      in: path
      name: userId
      schema:
        type: string
        description: The user ID.
        example: u5
        pattern: "^u[0-9]+$"
      required: true
    conversationId:
      in: path
      name: conversationId
      schema: 
        type: string
        description: The conversation ID.
        example: c32
        pattern: "^c[0-9]+$"
      required: true
    messageId:
      in: path
      name: messageId
      schema:
        type: string
        description: The message ID.
        example: m9
        pattern: "^m[0-9]+$"
      required: true
  securitySchemes:
      userAuth:
        type: http
        scheme: bearer
        bearerFormat: string