oopenapi: 3.0.4
info:
  title: WASAText
  version: 0.0.2
security: 
  - userAuth: []
paths: 
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      security: []
      requestBody:
        $ref: "#/components/requestBodies/usernameBody"
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: integer
                    example: "46327"
  /users/{userId}:
    patch:
      tags: ["user"]
      summary: Update user name.
      operationId: setMyUserName
      parameters: 
        - $ref: "#/components/parameters/userId"
      requestBody:
        $ref: "#/components/requestBodies/usernameBody"
      responses:
        "200":
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /chats:
    get:
      summary: See all chats of the user
      operationId: getMyConversations
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: List of chats previews in JSON format
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatPreview"
  /chats/{chatId}/messages:
    post:
      summary: Send a new message.
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/chatId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "201":
          description: Message created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /chats/{chatId}:
    get:
      summary: See chat details.
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: All the details of the chat, like its partecipants, its image...
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Chat"
components:
  schemas:
    User:
      type: object
      required: [id]
      properties:
        id: 
          type: integer
          format: int64
          example: 7
        username:
          type: string
          example: Mario
          minLength: 3
          maxLength: 16
        image:
        # TODO: capire come definire l'immagine nell'API
          type: string
    Chat:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          example: 11
        name:
          type: string
          example: Gruppo Calcio
        partecipants:
              type: array
              items:
                $ref: "#/components/schemas/User"
        image:
          type: string
        # TODO: capire come definire l'immagine nell'API
        type:
          type: string
          enum: [group, direct]
    ChatPreview:
      allOf:
        - $ref: "#/components/schemas/Chat"
        - type: object
          properties:
            latestMessage:
              $ref: "#/components/schemas/Message"
              # TODO: Se il messaggio è un'immagine voglio un'icona. Da implementare!
    Message:
      type: object
      required: [id, sender, content, timeStamp, status]
      properties:
        id: 
          type: integer
          format: int64
          example: 33
        sender:
          $ref: "#/components/schemas/User"
        content:
          type: string
          example: Hello! How are you?
          # TODO: capire come gestire l'API per mandare una foto tramite messaggio
        timeStamp:
          type: string
          format: date-time
          example: 2025-11-03T17:30:00+01:00
        comment:
          type: array
          items:
            type: object
            properties:
              reacter:
                $ref: "#/components/schemas/User"
              emoji:
                type: string
                example: 😋
        status:
          type: string
          description: Represents the message status, ✓ means *received*, ✓✓ means *read*
          enum: [✓, ✓✓]
        isForwarded:
          type: boolean
    UsernameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Maria
          pattern: 'ˆ.*?$'
          minLength: 3
          maxLength: 16
  parameters:
    userId:
      in: path
      name: userId
      schema:
        type: string
        description: The user ID.
        example: u5
        pattern: "^u[0-9]+$"
      required: true
    chatId:
      in: path
      name: chatId
      schema: 
        type: string
        description: The chat ID.
        example: c32
        pattern: "^c[0-9]+$"
      required: true
  requestBodies:
    usernameBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameRequest"
          required: true
  securitySchemes:
      userAuth:
        type: http
        scheme: bearer
        bearerFormat: string