openapi: 3.0.4
info:
  title: WASAText
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
security: 
  - userAuth: []
tags:
  - name: user
    description: Operations about user
  - name: login
    description: Access operation
  - name: conversation
    description: Operations about conversation
  - name: message
    description: Operations about message
paths:
  /session:
    post:
      tags: [login]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserID"
      security: []
  /users/{userId}:
    patch:
      tags: [user]
      summary: Updates username
      description: Changes the logged in username with a new one.
      operationId: setMyUserName
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        "200":
          description: Username update successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 45
                name: Mario
                image: https://example.com/image.png
  /users/{userId}/conversations:
    get:
      tags: [user]
      summary: Gives all of the user conversations
      description: |-
        Get a preview of all the user conversations. This preview includes 
        every attribute that a normal conversation has with the exception that 
        not all messages are obtained, just the latest one.
      operationId: getMyConversations
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
                required: [chats]
  /users/{userId}/photo:
    patch:
      tags: [user]
      summary: Updates user profile image
      operationId: setMyPhoto
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              description: Object containing the image in bin format
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: [conversation]
      summary: Gives conversation details
      operationId: getConversationDetails
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Conversation"
    patch:
      tags: [conversation]
      summary: Updates group name
      operationId: setGroupName
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the new group name
              properties:
                name:
                  type: string
                  example: Gruppo Università
                  description: The group name
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        "204":
          description: Group name updated successfully
  /conversations/{conversationId}/photo:
    patch:
      tags: [conversation]
      summary: Updates group profile image
      operationId: setGroupPhoto
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              description: Object containing the new image in bin format
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image
      responses:
        "200":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: [conversation]
      summary: Gives all messages of a conversation
      operationId: getConversation
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
                schema:
                  type: object
                  description: Object containing all the messages
                  required: [messageList]
                  properties:
                    messageList:
                      type: array
                      description: The message list
                      items:
                        $ref: "#/components/schemas/Message"
    post:
      tags: [conversation]
      summary: Sends a new message in a conversation
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "201":
          description: Message created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /conversations/{conversationId}/partecipants:
    post: 
      tags: [conversation]
      summary: Adds a user to a group
      operationId: AddToGroup
      parameters: 
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the user ID to add
              properties:
                userToAdd:
                  $ref: "#/components/schemas/UserID"
      responses:
        "201":
          description: User added successfully
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Partecipant"
  /conversations/{conversationId}/partecipants/me:
    delete:
      tags: [conversation]
      summary: Removes logged-in user from a group
      operationId: leaveGroup
      parameters: 
        - $ref: "#/components/parameters/conversationId"
      responses:
        "204":
          description: User removed successfully
  /messages:
    post:
      tags: [message]
      summary: Forwards a message to another conversation
      operationId: forwardMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the message ID and the conversation ID
              properties:
                forwardedForm:
                  $ref: "#/components/schemas/MessageID"
                destinationId:
                  $ref: "#/components/schemas/ConversationID"
      responses:
        '201':
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /messages/{messageId}:
    delete:
      tags: [message]
      summary: Deletes a message
      operationId: deleteMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "204":
          description: Comment removed successfully
  /messages/{messageId}/comments:
    post:
      tags: [message]
      summary: Comments a message with an emoji
      operationId: commentMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the emoji to add
              properties:
                emoji:
                  type: string
                  example: 😋
                  description: The emoji
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /messages/{messageId}/comments/me:  
    delete:
      tags: [message]
      operationId: uncommentMessage
      summary: Deletes a comment
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        '204':
          description: Comment removed successfully
components:
  schemas:
    UserID: 
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: It's assigned to every user when he/she register.
          minimum: 1
          maximum: 999999
      example:
        id: 32
      required: [id]
    UserName:
      type: object
      properties:
        name: 
          type: string
          description: It's chosen by the user when he/she log in. It can be changed.
          minLength: 3
          maxLength: 16
      example: 
        name: Mario
      required: [name]  
    User:
      allOf:
        - $ref: "#/components/schemas/UserID"
        - $ref: "#/components/schemas/UserName"
        - type: object
          properties:
            image:
              type: string
              format: url
              description: The location of the profile image uploaded by the user.
      example: 
        id: 32
        name: Mario
        image: https://example.com/image.png
      required: [id, name, image]
    ConversationID:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: It's unique and it's assigned to every conversation when it is started/created.
          minimum: 1
          maximum: 999999
      example:
        id: 43
      required: [id]
    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationID"
        - type: object
          properties:
            name:
              type: string
              description: |-
                It can be the username of the person you are talking to, 
                or the group name chosen during its creation.
            image:
              type: string
              format: url
              description: |-
                It will be your receiver image if it's a direct conversation,
                or the chosen group image if it's a group conversation.
            type:
              type: string
              enum: [group, direct]
              description: |- 
                Represents if a conversation can be a group with more
                than two partecipants or a direct one, with just two users.
            latestMessage:
              type: object
              properties:
                createdAt:
                  type: string
                  format: date-time
                  description: Represents when the message has been created.
                content:
                  anyOf:
                    - $ref: "#/components/schemas/MessageID"
                    - type: string
                      format: url
                  description: |- 
                    It can be the text of the message or 
                    a simple icon if the latest message is an image.
      example:
        id: 324
        name: Gruppo Calcio
        image: https://example.com/image.png
        type: group
        latestMessage: 
          createdAt: 2025-11-03T17:30:00+01:00
          content: 435
      required: [id, name, image, type, latestMessage]
    MessageID:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: It's unique and created when a message is sent or forwarded.
          minimum: 1
          maximum: 999999
      example:
        id: 56
      required: [id]
    Message:
      allOf:
          - $ref: "#/components/schemas/MessageID"
          - type: object
            properties:
              senderId:
                $ref: "#/components/schemas/UserID"
              chatId:
                $ref: "#/components/schemas/ConversationID"
              content:
                anyOf:
                  - title: text
                    type: string
                  - title: image
                    type: string
                    format: url
                description: It can be simple text, or the location of an image uploaded.
              timeStamp:
                type: string
                format: date-time
                description: The exact istant when the message is sent on the conversation.
              status:
                type: string
                enum: [read, sent, received]
              isForwarded:
                type: boolean
      example:
        id: 56
        senderId: 43
        chatId: 40
        content: Hello, how are you?
        timeStamp: 2025-11-03T17:30:00+01:00
        status: read
        isForwarded: false
      required: [senderId, chatId, content, timeStamp, status, isForwarded]
    Comment:
      type: object
      properties:
        reacterId:
          $ref: "#/components/schemas/UserID"
        emoji:
          type: string
          description: The reaction chosen by the reacter when he/she comment a message. It can only be an emoji.
      example:
        reacterId: 41
        emoji: 😋
      required: [reacterId, emoji]
    Partecipant:
      allOf:
        - $ref: "#/components/schemas/UserID"
        - type: object
          properties:
            isPartOf:
              $ref: "#/components/schemas/ConversationID"
      example:
        id: 459
        isPartOf: 32
      required: [id, isPartOf]
  parameters:
    userId:
      in: path
      name: userId
      schema:
        $ref: "#/components/schemas/UserID"
      required: true
    conversationId:
      in: path
      name: conversationId
      schema:
        $ref: "#/components/schemas/ConversationID"
      required: true
    messageId:
      in: path
      name: messageId
      schema:
        $ref: "#/components/schemas/MessageID"
      required: true
  securitySchemes:
      userAuth:
        type: http
        scheme: bearer
        bearerFormat: int64