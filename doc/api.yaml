openapi: 3.0.3
info:
  title: Project-WASA
  version: 1.0.0
servers:
  - url: http://localhost:3000
security:
  - userAuth: []
tags:
  - name: login
    description: Access operation
  - name: user
    description: Operations about user
  - name: conversation
    description: Operations about conversation
  - name: message
    description: Operations about message
  - name: special
    description: Other operations
paths:
  /session:
    post:
      tags: [login]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and all user data is returned.
        If the user exists, the user data is returned.
      operationId: doLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        '201':
          description: user log-in action successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserId" 
        '400':
          description: |-
            One of:
            - failed to decode login request
            - failed to encode login response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to get or create user id
            - user name can be min 3, max 16 and only contain letters, numbers, spaces, and special characters (_ . -)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /users/search:
    get:
      tags: [user]
      summary: Gets all users in the database.
      description: Obtain all users data in the database containing each the id, the name, and the image
      operationId: searchUsers
      responses:
        '200':
          description: user search successful
          content:
            application/json:
              schema:
                type: object
                description: The array containing all the users found.
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                    minItems: 0
                    maxItems: 999999
                example:
                  users:
                    - id: 1
                      name: "Mario"
                      photo: "9318319833-39812391-30918.png"
                    - id: 2
                      name: "Luigi"
                      photo: "38912391289-3813891-3813.png"
        '500':
          description: |-
            One of:
            - failed to get users from database
            - failed to encode users response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me:
    patch:
      tags: [user]
      summary: Updates username
      description: Changes the logged in username with a new one.
      operationId: setMyUserName
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        '200':
          description: user name update successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: user name can be min 3, max 16 and only contain letters, numbers, spaces, and special characters (_ . -)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '409':
          description: another user with the same name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to set new user name
            - failed to get updated user from database
            - failed to encode updated user response
            - failed to check user name in db
            - failed to decode updateUserName request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me/conversations:
    get:
      tags: [user]
      summary: Gives all of the user conversations, if the conversation is direct, get the name and photo from the other contacted user, depending on who is doing the operation.
      description: |-
        Gets all the user conversations, so for each one its id, name (which is the user name if its category is direct), photo (same as name), category (direct or group) and latest message content and timestamp.
      operationId: getMyConversations
      responses:
        '200':
          description: conversations got successfully
          content:
            application/json:
              schema:
                type: object
                description: The array with all the conversations inside.
                properties:
                  conversations:
                    type: array
                    minItems: 0
                    maxItems: 999999
                    items:
                      $ref: "#/components/schemas/Conversation"
                example:
                  - id: 324
                    name: "Soccer Group"
                    photo: 13812031280-291820-289172.png
                    category: group
                    latestMessage:
                      content: image.svg
                      timestamp: 2025-11-03T17:30:00+01:00
                  - id: 345
                    name: Luca
                    photo: 819123108-9381908-29081901.jpg
                    category: direct
                    latestMessage:
                      content: "Hi, how are you?"
                      timestamp: 2025-11-03T17:30:00+01:00
        '500':
          description: |-
            One of:
            - failed db operation to get user conversations
            - failed db operation to get other contact in direct conversation
            - failed db operation to get other user info in direct conversation
            - failed to encode the conversations response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [user]
      summary: Creates a new conversation.
      description: Adds a new conversation in db with no name and photo if category == direct, or with a default name "Nuovo Gruppo" and default photo if not specified"
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: 
                  type: string
                  pattern: ^[A-Za-z0-9 _.-]{3,16}$
                  minLength: 3
                  maxLength: 16
                participantIds:
                  type: array
                  items:
                    type: integer
                category:
                  type: string
                  enum: ["direct", "group"]
      responses:
        '201':
          description: conversation created
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '400':
          description: |-
            One of:
            - creator cannot be a participant in the conversation
            - direct conversation must have exactly one participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: participant user id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '409':
          description: direct conversation between these users already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to decode createConversation request
            - failed to check if participant user id exists
            - failed to create group conversation
            - failed to create direct conversation
            - failed db operation to get other contact in direct conversation
            - failed db operation to get other user info in direct conversation
            - failed to encode create conversation response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me/photo:
    put:
      tags: [user]
      summary: Updates user profile 
      description: |-
        Replaces profile with the new one. Returns the
        user resource with the url inside updated.
      operationId: setMyPhoto
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Image"
      responses:
        '201':
          description: user profile photo set/updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filename"
        '400':
          description: |-
            One of:
            - failed to parse multipart form
            - photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to create photo file
            - failed to copy uploaded photo file
            - failed to set/update profile photo in db
            - failed to encode filename response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/by_name/{name}:
    get:
      tags: [user]
      summary: Get user by name.
      description: Get user info by name, so its id, name and photo.
      operationId: getUserByName
      parameters:
        - $ref: "#/components/parameters/userName"
      responses:
        '200':
          description: user got successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: missing user identifier in path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to get user from database
            - failed to encode user response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/by_id/{id}:
    get:
      tags: [user]
      summary: Get user by id.
      description: Get user info by id, so its id, name and photo.
      operationId: getUserById
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        '200':
          description: user got successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: invalid user id in path, or failed parse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to get user from database
            - failed to encode user response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: [conversation]
      summary: Gives conversation details
      description: |-
        Returns the resource "conversation" with all its properties.
        See its schema for more info.
      operationId: getConversation
      responses:
        '200':
          description: Successfully operation
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Conversation"
        '400':
          description: invalid conversation id in path, or failed parse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to get conversation from database
            - failed db operation to get other contact in direct conversation
            - failed db operation to get other user info in direct conversation
            - failed to encode conversation response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [conversation]
      summary: Updates/Creates group name
      description: |-
        Changes the attribute "name" of the resource "conversation"
        with the new name in the body. It works only if the conversation is of type "group".
      operationId: setGroupName
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
              description: Object containing the new group name
              properties:
                name:
                  type: string
                  example: Soccer Group
                  description: The group name
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        '200':
          description: Group name updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '400':
          description: |-
            One of:
            - failed to get conversation id from path or invalid format
            - conversation is not a group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500': 
          description: |-
            One of:
            - failed to decode request
            - failed to check if the conversation it's a group in the database
            - failed to set new group name
            - failed to get updated conversation from database
            - failed to encode updated conversation response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conversations/{conversationId}/photo:
    put:
      tags: [conversation]
      summary: Updates group profile 
      description: |-
        Replaces group  with the new one. Returns the
        conversation resource with the url inside updated. It works
        ONLY if the type attribute is group.
      operationId: setGroupPhoto
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Image"
      responses:
        '201':
          description: group photo set/updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filename"
        '400':
          description: |-
            One of:
            - failed to get conversation id from path or invalid format
            - conversation does not exist
            - conversation is not a group
            - failed to parse multipart form
            - file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to create photo file
            - failed to copy uploaded photo file
            - failed to set/update profile photo in db
            - failed to encode filename response
            - failed to check if the conversation exists in the databas
            - failed to check if the conversation is a group in the database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: [conversation]
      summary: Gives all messages of a conversation
      description: |-
        Returns all the messages resources associated
        with the provided conversation.
      operationId: getMessages
      responses:
        '200':
          description: messages got successfully
          content:
            application/json:
                schema:
                  type: object
                  description: array of messages in json
                  properties:
                    messages:
                      type: array
                      items:
                        $ref: "#/components/schemas/Message"
                  example:
                      - id: 56
                        senderId:
                          id: 43
                        conversationId:
                          id: 40
                        content: Hello, how are you?
                        timestamp: 2025-11-03T17:30:00+01:00
                        status: read
                        isForwarded: false
                      - id: 98
                        senderId:
                          id: 452
                        conversationId:
                          id: 73
                        content: https://example.com/.png
                        timestamp: 2023-01-23T12:37:00+01:00
                        status: received
                        isForwarded: true
        '400':
          description: invalid conversation id in path, or failed parse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to get messages from database
            - failed to update message status
            - failed to update message status
            - failed to check if message is read by all
            - failed to encode messages response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [conversation]
      summary: Sends a new message in a conversation
      description: |-
        Creates a message resource associated with the
        conversation the user is writing in and returns it.
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the message to send
              properties:
                content:
                  type: string
                  description: It can be simple text, or photo filename.
                  pattern: .*
                  minLength: 1
                  maxLength: 100
      responses:
        '201':
          description: Message created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          description: |-
            One of:
            - failed to get conversation id from path or invalid format
            - conversation doesn't exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: sender is not a participant of the conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to decode sendMessage request
            - failed to check if conversation exists
            - failed to check if sender is a participant of the conversation
            - failed to create the message in the database
            - failed to get participants of the conversation
            - failed to add message status for a participant
            - failed to update latest message in the database
            - failed to retrieve the created message from the database
            - failed to encode response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conversations/{conversationId}/participants:
    parameters:
        - $ref: "#/components/parameters/conversationId"
    post:
      tags: [conversation]
      summary: Adds a user to a group
      description: |-
        Adds a participant resource linking the user with the
        id provided to the conversation.
        The conversation must be of type "group" to work.
      operationId: addToGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        '200':
          description: user added successfully
        '400':
          description: |-
            One of:
            - invalid group id
            - user not found
            - conversation is not a group
            - user is already a participant in the group conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to decode addToGroup request
            - failed to get user by name
            - failed to check if conversation is a group
            - failed to check if user is already a participant
            - failed to add user to group conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [conversation]
      summary: Removes logged-in user from a group
      description: |-
        Deletes the participant resource associated with the user and the conversation in the path.
        The conversation must be of type "group" to work.
      operationId: leaveGroup
      responses:
        '204':
          description: User removed successfully
        '400':
          description: |-
            One of:
            - invalid group id
            - conversation is not a group
            - user is not a participant in the group conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to check if conversation is a group
            - failed to check if user is a participant
            - failed to remove user from group conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conversations/:conversationId/messages/image:
    post:
      tags: [conversation]
      summary: adds an image into the server
      description: upload a new image into the server, saving only its filename into the db. Used for sending images into the conversation.
      operationId: uploadImage
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Image"
      responses:
        '201':
          description: image created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filename"
        '400':
          description: |-
            One of:
            - invalid conversation id
            - failed to parse multipart form
            - file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to create file
            - failed to copy uploaded file
            - failed to create image in db
            - failed to get participants of the conversation
            - failed to add image status for a participant
            - failed to update latest image in the database
            - failed to retrieve the created image from the database
            - failed to encode response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conversations/:conversationId/messages/:messageId:
    delete:
      tags: [message]
      summary: Deletes a message
      description: |-
        Deletes a message resource.
        Works only if the message is sent by the logged in user.
      operationId: deleteMessage
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - $ref: "#/components/parameters/messageId"
      responses:
        '204':
          description: comment removed successfully
        '400':
          description: |-
            One of:
            - invalid message id in path, or failed parse
            - invalid conversation id in path, or failed parse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: message does not exist or does not belong to user
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to check if message exists in database
            - failed to delete message
            - failed to delete comments related to the message
            - failed to get participants of the conversation
            - failed to add message status for a participant
            - failed to update latest message in the database
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
  /messages/:messageId:
    get:
      tags: [message]
      summary: Get a message by id
      description: Get all message info by id, like senderId, conversationId etc... See its schema for more info
      operationId: getMessage
      responses:
        '200':
          description: message got successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          description: invalid message id in path, or failed parse
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to get message
            - failed to encode message response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /messages/:messageId/forward:
    post:
      tags: [message]
      summary: Forwards a message to another conversation
      description: |-
        Copies only the body of the message with the id provided and sends it
        as a new message resource to the conversation with the id provided.
      operationId: forwardMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationId"
      responses:
        '201':
          description: message forwarded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          description: |-
            One of:
            - failed to decode forward message request
            - could not convert message id in path to int or invalid format
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        '404':
          description: |-
            One of:
            - message does not exist
            - conversation does not exist
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to check if message exists
            - failed to check if conversation exists
            - failed to forward message
            - failed to get participants of the conversation
            - failed to add message status for a participant
            - failed to update latest message in the database
            - failed to get forwarded message details
            - failed to encode forward message response
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
  /messages/{messageId}/comments:
    parameters:
      - $ref: "#/components/parameters/messageId"
    get:
      tags: [message]
      summary: Get all comments
      description: Get all comments info by message id, so their reacterIds, messageIds and emojis
      operationId: getComments
      responses:
        '200':
          description: message got successfully
          content:
            application/json:
              schema:
                type: array
                description: The array of comments returned
                items:
                  $ref: "#/components/schemas/Comment"
        '400':
          description: invalid message id in path, or failed parse
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to get message
            - failed to encode message response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [message]
      summary: Comments a message with an emoji
      description: Creates a new comment to an existing message and returns it.
      operationId: commentMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the emoji to comment
              properties:
                emoji:
                  type: string
                  description: |-
                    The reaction chosen by the reacter when he/she comment a message. 
                    It can only be an emoji. 
                  pattern: .*
                  minLength: 1
                  maxLength: 10
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        '400':
          description: |-
            One of:
            - invalid message id in path, or failed parse
            - invalid emoji for comment
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        '403':
          description: user is not a participant of the conversation containing the message
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        '404':
          description: message does not exist
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to decode commentMessage request
            - failed to check if user is participant of the conversation containing the message
            - failed to check if message exists
            - failed to add comment to message
            - failed to encode comment message response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [message]
      summary: Deletes a comment
      description: |-
        Deletes a comment resource from an existing message.
        Works only if the comment is sent by the logged in user.
      operationId: uncommentMessage
      responses:
        '204':
          description: comment removed successfully
        '400':
          description: invalid message id in path, or failed parse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '403':
          description: user is not a participant of the conversation containing the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: message does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: |-
            One of:
            - failed to check if message exists
            - failed to check if user is participant of the conversation containing the message
            - failed to check if comment exists or belongs to commenter
            - failed to remove comment from message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /images/:imageId:
    get:
      tags: [special]
      summary: Gets an image
      description: Get the file using the filename (or imageId)
      operationId: getImage
      parameters:
        - $ref: "#/components/parameters/imageId"
      responses:
        '200':
          description: image sent successfully
components:
  schemas:
    UserId:
      type: object
      description: It's assigned to every user when he/she register.
      properties:
        userId:
          type: integer
          format: int64
          description: It's assigned to every user when he/she register.
          minimum: 1
          maximum: 999999
      example:
        id: 32
      required: [id]
    UserName:
      type: object
      description: It's chosen by the user when he/she log in. It can be changed.
      properties:
        name:
          type: string
          description: It's chosen by the user when he/she log in. It can be changed.
          pattern: ^[A-Za-z0-9 _.-]{3,16}$
          minLength: 3
          maxLength: 16
      example:
        name: Mario
    User:
      allOf:
        - $ref: "#/components/schemas/UserId"
        - $ref: "#/components/schemas/UserName"
        - type: object
          properties:
            photo:
              type: string
              format: url
              description: The location of the profile  uploaded by the user.
      example:
        id: 32
        name: Mario
        photo: https://example.com/.png
      required: [id, name, ]
    ConversationId:
      type: object
      description: It's unique and it's assigned to every conversation when it is started/created.
      properties:
        conversationId:
          type: integer
          format: int64
          description: It's unique and it's assigned to every conversation when it is started/created.
          minimum: 1
          maximum: 999999
      example:
        id: 43
      required: [id]
    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationId"
        - type: object
          properties:
            name:
              type: string
              description: |-
                It can be the username of the person you are talking to,
                or the group name chosen during its creation.
            photo:
              type: string
              format: url
              description: |-
                It will be your receiver  if it's a direct conversation,
                or the chosen group  if it's a group conversation.
            category:
              type: string
              enum: [group, direct]
              description: |-
                Represents if a conversation can be a group with more
                than two participants or a direct one, with just two users.
            latestMessageContent:
              anyOf:
                - title: text
                  type: string
                  pattern: .*
                  minLength: 1
                  maxLength: 100
                - title: photo
                  type: string
                  format: url
                  pattern: ^[a-zA-Z]+://.+$
                  minLength: 8
                  maxLength: 100
              description: It can be simple text, or the location of an image uploaded.
            latestMessageTimestamp:
              type: string
              format: date-time
              description: The exact instant when the message is sent on the conversation.
              minLength: 20
              maxLength: 25
      example:
        id: 324
        name: Soccer Group
        photo: https://example.com/.png
        type: group
        latestMessage:
          createdAt: 2025-11-03T17:30:00+01:00
          body: 435
      required: [id, name, type]
    MessageId:
      type: object
      description: It's unique and created when a message is sent or forwarded.
      properties:
        id:
          type: integer
          format: int64
          description: It's unique and created when a message is sent or forwarded.
          minimum: 1
          maximum: 999999
      example:
        id: 56
      required: [id]
    Message:
      description: Created when a user write in a group or in a direct conversation.
      allOf:
          - $ref: "#/components/schemas/MessageId"
          - type: object
            properties:
              senderId:
                $ref: "#/components/schemas/UserId"
              conversationId:
                $ref: "#/components/schemas/ConversationId"
              content:
                anyOf:
                  - title: text
                    type: string
                    pattern: .*
                    minLength: 1
                    maxLength: 100
                  - title: photo
                    type: string
                    format: url
                    pattern: ^[a-zA-Z]+://.+$
                    minLength: 8
                    maxLength: 100
                description: It can be simple text, or the location of an image uploaded.
              timestamp:
                type: string
                format: date-time
                description: The exact instant when the message is sent on the conversation.
                minLength: 20
                maxLength: 25
              status:
                type: string
                enum: [read, sent]
                description: Represents when the message has been read or just sent.
                minLength: 4
                maxLength: 8
              isForwarded:
                type: boolean
                description: Represents if the message message has been forwarded or not.
      example:
        id: 56
        senderId: 43
        conversationId: 40
        content: Hello, how are you?
        timestamp: 2025-11-03T17:30:00+01:00
        status: read
        isForwarded: false
      required: [senderId, conversationId, content, timestamp, status, isForwarded]
    Comment:
      type: object
      description: Created when a user want to react to an existing message with an emoji.
      properties:
        reacterId:
          $ref: "#/components/schemas/UserId"
        messageId:
          $ref: "#/components/schemas/MessageId"
        emoji:
          type: string
          description: The reaction chosen by the reacter when he/she comment a message. It can only be an emoji.
          pattern: .*
          minLength: 1
          maxLength: 10
      example:
        reacterId:
          id: 54
        emoji: 😋
      required: [reacterId, emoji]
    Image:
      type: string
      format: binary
      description: The photo binary file, used for profile and group conversations.
      minLength: 1
      maxLength: 13981014 # 10MB circa
    Filename:
      type: object
      properties:
        fileName: 
          type: string
    Error: 
      type: object
      description: The error reponse structure used for every error response in the project.
      properties:
        status: 
          type: string
          description: The http standard status response
          minLength: 1
          maxLength: 30
        code:
          type: integer
          format: int64
          description: The http standard code response
          minimum : 1
          maximum: 3
        message:
          type: string
          minLength: 1
          maxLength: 999999
      example:
        status: "Bad Request"
        code: 400
        message: "failed to decode the request body"
  parameters:
    imageId:
      in: path
      name: filename
      schema:
        $ref: "#/components/schemas/Filename"
      required: true
    userName:
      in: path
      name: userName
      description: It's chosen by the user when he/she log in. It can be changed.
      schema: 
        $ref: "#/components/schemas/UserName"
      required: true
    userId:
      in: path
      name: userId
      description: It's assigned to every user when he/she register.
      schema:
        $ref: "#/components/schemas/UserId"
      required: true
    conversationId:
      in: path
      name: conversationId
      description: It's unique and it's assigned to every conversation when it is started/created.
      schema:
        $ref: "#/components/schemas/ConversationId"
      required: true
    messageId:
      in: path
      name: messageId
      description: It's unique and created when a message is sent or forwarded.
      schema:
        $ref: "#/components/schemas/MessageId"
      required: true
  securitySchemes:
      userAuth:
        type: http
        scheme: bearer
        bearerFormat: int64