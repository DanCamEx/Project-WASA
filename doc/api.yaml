openapi: 3.0.4
info:
  title: WASAText
  version: 0.0.4
security: 
  - userAuth: []
tags:
  - name: user
    description: Operations about user
  - name: login
    description: Access operation
  - name: conversation
    description: Operations about conversation
  - name: message
    description: Operations about message
paths:
  /session:
    post:
      tags: [login]
      summary: Logs in the user.
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    $ref: "#/components/parameters/userId"
  /users/me:
    patch:
      tags: [user]
      summary: Updates username.
      description: Changes the logged in username with a new one.
      operationId: setMyUserName
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: 'ˆ.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/me/conversations:
    get:
      tags: [user]
      summary: Gives all of the user conversations.
      description: |-
        Get a preview of all the user conversations. This preview includes 
        every attribute that a normal conversation has with the exception that 
        not all messages are obtained, just the latest one.
      operationId: getMyConversations
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationPreview"
  /users/me/photo:
    patch:
      tags: [user]
      summary: Updates user profile image.
      operationId: setMyPhoto
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /conversations/{id}:
    get:
      tags: [conversation]
      summary: Gives conversation details.
      operationId: getConversationDetails
      parameters:
        - $ref: "#/components/parameters/conversationId"
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Conversation"
    patch:
      tags: [conversation]
      summary: Updates group name.
      operationId: setGroupName
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Gruppo Università
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        "204":
          description: Group name updated successfully
  /conversations/{id}/photo:
    patch:
      tags: [conversation]
      summary: Updates group profile image.
      operationId: setGroupPhoto
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{id}/messages:
    get:
      tags: [conversation]
      summary: Gives all messages of a conversation.
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/conversationId"
      responses:
        "200":
          description: Successfull operation
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    messages:
                      type: array
                      items:
                        $ref: "#/components/schemas/Message"
    post:
      tags: [conversation]
      summary: Sends a new message in a conversation.
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "201":
          description: Message created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /conversations/{id}/partecipants:
    post: 
      tags: [conversation]
      summary: Adds a user to a group.
      operationId: AddToGroup
      parameters: 
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userToAdd:
                  $ref: "#/components/parameters/userId"
      responses:
        "201":
          description: User added successfully
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Partecipant"
  /conversations/{id}/partecipants/me:
    delete:
      tags: [conversation]
      summary: Removes logged-in user from a group.
      operationId: leaveGroup
      parameters: 
        - $ref: "#/components/parameters/conversationId"
      responses:
        "204":
          description: User removed successfully
  /messages:
    post:
      tags: [message]
      summary: Forwards a message to another conversation.
      operationId: forwardMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                forwardedForm:
                  $ref: "#/components/parameters/messageId"
                destinationId:
                  $ref: "#/components/parameters/conversationId"
        required: true
      responses:
        '201':
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /messages/{id}:
    delete:
      tags: [message]
      summary: Deletes a message.
      operationId: deleteMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "204":
          description: Comment removed successfully
  /messages/{id}/comments:
    post:
      tags: [message]
      summary: Comments a message with an emoji.
      operationId: commentMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
                  example: 😋
        required: true
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /messages/{id}/comments/me:  
    delete:
      tags: [message]
      operationId: uncommentMessage
      summary: Deletes a comment.
      parameters:
        - $ref: "#/components/parameters/messageId"
        - $ref: "#/components/parameters/userId"
      responses:
        '204':
          description: Comment removed successfully
components:
  schemas:
    User:
      type: object
      required: [id]
      properties:
        id: 
          $ref: "#/components/parameters/userId"
        username:
          type: string
          example: Mario
          minLength: 3
          maxLength: 16
        image:
          type: string
          format: uri
    Partecipant:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            isPartOf:
              $ref: "#/components/parameters/conversationId"
    Conversation:
      type: object
      required: [id]
      properties:
        id:
          $ref: "#/components/parameters/conversationId"
        name:
          type: string
          example: Gruppo Calcio
        image:
          type: string
          format: uri
        type:
          type: string
          enum: [group, direct]
    ConversationPreview:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            latestMessage:
              anyOf:
                - $ref: "#/components/parameters/messageId"
                - type: string
                  format: uri
    Message:
      type: object
      required: [id, senderId, conversationId, content, timeStamp]
      properties:
        id: 
          $ref: "#/components/parameters/messageId"
        senderId:
          $ref: "#/components/parameters/userId"
        conversationId:
          $ref: "#/components/parameters/conversationId"
        content:
          anyOf:
            - type: string
              example: Hello! How are you?
            - type: string
              format: uri
        timeStamp:
          type: string
          format: date-time
          example: 2025-11-03T17:30:00+01:00
        status:
          type: string
          description: Represents the message status, ✓ means *received*, ✓✓ means *read*
          enum: [✓, ✓✓]
        isForwarded:
          type: boolean
    Comment:
      type: object
      properties:
        reacterId:
          $ref: "#/components/parameters/userId"
        emoji:
          type: string
          example: 😋
  parameters:
    userId:
      in: path
      name: id
      schema:
        type: integer
        format: int64
        description: The user ID.
        example: 5
      required: true
    conversationId:
      in: path
      name: id
      schema: 
        type: integer
        format: int64
        description: The conversation ID.
        example: 32
      required: true
    messageId:
      in: path
      name: id
      schema:
        type: integer
        format: int64
        description: The message ID.
        example: 9
      required: true
  securitySchemes:
      userAuth:
        type: http
        scheme: bearer
        bearerFormat: int64