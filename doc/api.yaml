openapi: 3.0.3
info:
  title: WASAText
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
security:
  - userAuth: []
tags:
  - name: user
    description: Operations about user
  - name: login
    description: Access operation
  - name: conversation
    description: Operations about conversation
  - name: message
    description: Operations about message
paths:
  /session:
    post:
      tags: [login]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserId"
      security: []
  /users/{userId}:
    patch:
      tags: [user]
      summary: Updates username
      description: Changes the logged in username with a new one.
      operationId: setMyUserName
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        "200":
          description: Username update successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}/conversations:
    get:
      tags: [user]
      summary: Gives all of the user conversations
      description: |-
        Gets a preview of all the user conversations. This preview includes
        every attribute that a normal conversation has with the exception that
        not all messages are obtained, just the latest one.
      operationId: getMyConversations
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Successfully operation
          content:
            application/json:
              schema:
                type: object
                description: |-
                  Represents all the direct conversations started and the
                  groups joined/created by the user.
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
                    description: The array with all the conversations inside.
                    minItems: 0
                    maxItems: 999999
                example:
                  conversations:
                    - id: 324
                      name: Soccer Group
                      image: https://example.com/image.png
                      type: group
                      latestMessage:
                        createdAt: 2025-11-03T17:30:00+01:00
                        body: https://example.com/icon.png
                    - id: 345
                      name: Luca
                      image: https://example.com/image.png
                      type: direct
                      latestMessage:
                        createdAt: 2025-12-03T17:30:00+01:00
                        body:
                          id: 34
                required: [conversations]
  /users/{userId}/photo:
    put:
      tags: [user]
      summary: Updates user profile image
      description: |-
        Replaces profile image with the new one. Returns the
        user resource with the url inside updated.
      operationId: setMyPhoto
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUpload"
      responses:
        "200":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}/conversations/:
    # TODO add POST to create a new conversation
    delete:
      tags: [conversation]
      summary: Removes logged-in user from a group
      description: |-
        Deletes the participant resource associated with the user and the conversation in the path.
        The conversation must be of type "group" to work.
      operationId: leaveGroup
      parameters:
        - $ref: "#/components/parameters/conversationId"
        - $ref: "#/components/parameters/userId"
      responses:
        "204":
          description: User removed successfully
  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: [conversation]
      summary: Gives conversation details
      description: |-
        Returns the resource "conversation" with all its properties.
        See its schema for more info.
      operationId: getConversationDetails
      responses:
        "200":
          description: Successfully operation
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Conversation"
    patch:
      tags: [conversation]
      summary: Updates group name
      description: |-
        Changes the attribute "name" of the resource "conversation"
        with the new name in the body. It works only if the conversation is of type "group".
      operationId: setGroupName
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
              description: Object containing the new group name
              properties:
                name:
                  type: string
                  example: Soccer Group
                  description: The group name
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        "200":
          description: Group name updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/photo:
    put:
      tags: [conversation]
      summary: Updates group profile image
      description: |-
        Replaces group image with the new one. Returns the
        conversation resource with the url inside updated. It works
        ONLY if the type attribute is group.
      operationId: setGroupPhoto
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUpload"
      responses:
        "200":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: [conversation]
      summary: Gives all messages of a conversation
      description: |-
        Returns all the messages resources associated
        with the provided conversation.
      operationId: getConversation
      responses:
        "200":
          description: Successfully operation
          content:
            application/json:
                schema:
                  type: object
                  description: Object containing all the messages
                  required: [messageList]
                  properties:
                    messageList:
                      type: array
                      description: The message list
                      items:
                        $ref: "#/components/schemas/Message"
                      minItems: 0
                      maxItems: 999999
                  example:
                    messageList:
                      - id: 56
                        senderId:
                          id: 43
                        conversationId:
                          id: 40
                        content: Hello, how are you?
                        timestamp: 2025-11-03T17:30:00+01:00
                        status: read
                        isForwarded: false
                      - id: 98
                        senderId:
                          id: 452
                        conversationId:
                          id: 73
                        content: https://example.com/image.png
                        timestamp: 2023-01-23T12:37:00+01:00
                        status: received
                        isForwarded: true
    post:
      tags: [conversation]
      summary: Sends a new message in a conversation
      description: |-
        Creates a message resource associated with the
        conversation the user is writing in and returns it.
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the message to send
              properties:
                messageToSend:
                  type: string
                  description: It can be simple text, or the location of an image uploaded.
                  anyOf:
                    - title: text
                      type: string
                      pattern: .*
                      minLength: 1
                      maxLength: 100
                    - title: image
                      type: string
                      format: url
                      pattern: ^[a-zA-Z]+://.+$
                      minLength: 8
                      maxLength: 100
      responses:
        "201":
          description: Message created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /conversations/{conversationId}/participants:
    post:
      tags: [conversation]
      summary: Adds a user to a group
      description: |-
        Adds a participant resource linking the user with the
        id provided to the conversation.
        The conversation must be of type "group" to work.
      operationId: addToGroup
      parameters:
        - $ref: "#/components/parameters/conversationId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the user id to add
              properties:
                userToAdd:
                  $ref: "#/components/schemas/UserId"
      responses:
        "201":
          description: User added successfully
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Participant"
  /messages:
    post:
      tags: [message]
      summary: Forwards a message to another conversation
      description: |-
        Copies only the body of the message with the id provided and sends it
        as a new message resource to the conversation with the id provided.
      operationId: forwardMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the message id and the conversation id
              properties:
                forwardedForm:
                  $ref: "#/components/schemas/MessageId"
                destinationId:
                  $ref: "#/components/schemas/ConversationId"
      responses:
        '201':
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /messages/{messageId}:
    delete:
      tags: [message]
      summary: Deletes a message
      description: |-
        Deletes a message resource.
        Works only if the message is sent by the logged in user.
      operationId: deleteMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "204":
          description: Comment removed successfully
  /messages/{messageId}/comments:
    post:
      tags: [message]
      summary: Comments a message with an emoji
      description: Creates a new comment to an existing message and returns it.
      operationId: commentMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the emoji to comment
              properties:
                emoji:
                  type: string
                  description: |-
                    The reaction chosen by the reacter when he/she comment a message. 
                    It can only be an emoji. 
                  pattern: .*
                  minLength: 1
                  maxLength: 10
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /messages/{messageId}/comments/:
    delete:
      tags: [message]
      operationId: uncommentMessage
      summary: Deletes a comment
      description: |-
        Deletes a comment resource from an existing message.
        Works only if the comment is sent by the logged in user.
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        '204':
          description: Comment removed successfully
components:
  schemas:
    UserId:
      type: object
      description: It's assigned to every user when he/she register.
      properties:
        id:
          type: integer
          format: int64
          description: It's assigned to every user when he/she register.
          minimum: 1
          maximum: 999999
      example:
        id: 32
      required: [id]
    UserName:
      type: object
      description: It's chosen by the user when he/she log in. It can be changed.
      properties:
        name:
          type: string
          description: It's chosen by the user when he/she log in. It can be changed.
          pattern: .*
          minLength: 3
          maxLength: 16
      example:
        name: Mario
    User:
      allOf:
        - $ref: "#/components/schemas/UserId"
        - $ref: "#/components/schemas/UserName"
        - type: object
          properties:
            image:
              type: string
              format: url
              description: The location of the profile image uploaded by the user.
      example:
        id: 32
        name: Mario
        image: https://example.com/image.png
      required: [id, name, image]
    ConversationId:
      type: object
      description: It's unique and it's assigned to every conversation when it is started/created.
      properties:
        id:
          type: integer
          format: int64
          description: It's unique and it's assigned to every conversation when it is started/created.
          minimum: 1
          maximum: 999999
      example:
        id: 43
      required: [id]
    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationId"
        - type: object
          properties:
            name:
              type: string
              description: |-
                It can be the username of the person you are talking to,
                or the group name chosen during its creation.
            image:
              type: string
              format: url
              description: |-
                It will be your receiver image if it's a direct conversation,
                or the chosen group image if it's a group conversation.
            type:
              type: string
              enum: [group, direct]
              description: |-
                Represents if a conversation can be a group with more
                than two participants or a direct one, with just two users.
            latestMessage:
              $ref: "#/components/schemas/MessageId"
      example:
        id: 324
        name: Soccer Group
        image: https://example.com/image.png
        type: group
        latestMessage:
          createdAt: 2025-11-03T17:30:00+01:00
          body: 435
      required: [id, name, image, type]
    MessageId:
      type: object
      description: It's unique and created when a message is sent or forwarded.
      properties:
        id:
          type: integer
          format: int64
          description: It's unique and created when a message is sent or forwarded.
          minimum: 1
          maximum: 999999
      example:
        id: 56
      required: [id]
    Message:
      description: Created when a user write in a group or in a direct conversation.
      allOf:
          - $ref: "#/components/schemas/MessageId"
          - type: object
            properties:
              senderId:
                $ref: "#/components/schemas/UserId"
              conversationId:
                $ref: "#/components/schemas/ConversationId"
              content:
                anyOf:
                  - title: text
                    type: string
                    pattern: .*
                    minLength: 1
                    maxLength: 100
                  - title: image
                    type: string
                    format: url
                    pattern: ^[a-zA-Z]+://.+$
                    minLength: 8
                    maxLength: 100
                description: It can be simple text, or the location of an image uploaded.
              timestamp:
                type: string
                format: date-time
                description: The exact instant when the message is sent on the conversation.
                minLength: 20
                maxLength: 25
              status:
                type: string
                enum: [read, sent]
                description: Represents when the message has been read or just sent.
                minLength: 4
                maxLength: 8
              isForwarded:
                type: boolean
                description: Represents if the message message has been forwarded or not.
      example:
        id: 56
        senderId: 43
        conversationId: 40
        content: Hello, how are you?
        timestamp: 2025-11-03T17:30:00+01:00
        status: read
        isForwarded: false
      required: [senderId, conversationId, content, timestamp, status, isForwarded]
    Comment:
      type: object
      description: Created when a user want to react to an existing message with an emoji.
      properties:
        reacterId:
          $ref: "#/components/schemas/UserId"
        messageId:
          $ref: "#/components/schemas/MessageId"
        emoji:
          type: string
          description: The reaction chosen by the reacter when he/she comment a message. It can only be an emoji.
          pattern: .*
          minLength: 1
          maxLength: 10
      example:
        reacterId:
          id: 54
        emoji: 😋
      required: [reacterId, emoji]
    Participant:
      description: A link which connect a user to a conversation.
      allOf:
        - $ref: "#/components/schemas/UserId"
        - type: object
          properties:
            isPartOf:
              $ref: "#/components/schemas/ConversationId"
      example:
        id: 459
        isPartOf: 32
      required: [id, isPartOf]
    ImageUpload:
      type: object
      description: The way to upload an image, used for profile and group images.
      properties:
        uploadedImage:
          type: string
          format: binary
          description: The image binary file to upload, could be the profile image, the group image etc...
          minLength: 1
          maxLength: 13981014 # 10MB circa
      example:
        uploadedImage: (binary image data)
      required: [uploadedImage]
  parameters:
    userId:
      in: path
      name: userId
      description: It's assigned to every user when he/she register.
      schema:
        $ref: "#/components/schemas/UserId"
      required: true
    conversationId:
      in: path
      name: conversationId
      description: It's unique and it's assigned to every conversation when it is started/created.
      schema:
        $ref: "#/components/schemas/ConversationId"
      required: true
    messageId:
      in: path
      name: messageId
      description: It's unique and created when a message is sent or forwarded.
      schema:
        $ref: "#/components/schemas/MessageId"
      required: true
  securitySchemes:
      userAuth:
        type: http
        scheme: bearer
        bearerFormat: int64
